version: "3.8"

services:
  # PostgreSQL with PostGIS for Development
  postgres:
    image: postgis/postgis:15-3.4
    container_name: bali-car-charter-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: bali_car_charter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma:/docker-entrypoint-initdb.d/scripts
    environment:
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: bali-car-charter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # OSRM Routing Engine (Optional for development)
  osrm:
    image: osrm/osrm-backend:latest
    container_name: bali-car-charter-osrm
    ports:
      - "5000:5000"
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/bali.osrm
    restart: unless-stopped
    depends_on:
      - postgres

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: bali-car-charter-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  osrm_data:
